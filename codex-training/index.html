 {t:'المشاريع الكبيرة والسياق',goal:'يعمل المتدرب على مستودع كبير دون أن تضيع الأداة أو تعيد كتابة ما لا يلزم.',
  min:[[0,15,'لماذا يفشل الطلب العريض على ٥٠ ألف سطر'],[15,45,'تقسيم مهمة كبيرة إلى ثلاث مهام بمعايير انتهاء'],[45,70,'حصر النطاق: ملفات محددة، أوامر محددة، ممنوعات'],[70,90,'مهام متوازية ومتى تكون خطأً']],
  prompts:['لا تبنِ الميزة. اكتب خطة من ثلاث خطوات، كل خطوة قابلة للدمج وحدها، وقل لي ما سيتعطّل في كل خطوة','نفّذ الخطوة الأولى فقط في الملفات الثلاثة المذكورة، ولا تعدّل التهيئة'],
  out:'خطة تنفيذ لمهمة حقيقية من عمل المتدرب + أول خطوة مدموجة.',
  trap:{sign:'إعادة هيكلة واسعة غير مطلوبة تظهر في الفرق',say:'الممنوعات تُكتب في المهمة لا تُترك للفهم: لا إعادة تسمية، لا ترقية حزم، لا تنسيق ملفات لم تُمسّ.'}},
 {t:'الأمان والترخيص والبيانات',goal:'يعرف المتدرب ما لا يُرسَل، وما لا يُسلَّم للعميل، وكيف يُفحص الناتج.',
  min:[[0,20,'الأسرار: مفاتيح، ملفات .env، بيانات عملاء حقيقية'],[20,45,'فحص الفرق: مدخلات غير محقّقة، صلاحيات مفتوحة، تسجيل بيانات حساسة'],[45,70,'الترخيص والمصادر، وما يُقال للعميل'],[70,90,'قائمة فحص ما قبل التسليم، تُطبّق على عمل الجلسة الثانية']],
  prompts:['افحص هذا الفرق واذكر فقط: أي مدخل غير محقّق، أي صلاحية أوسع من اللازم، أي تسجيل لبيانات شخصية','أخرج أي مفتاح من الكود إلى متغيرات بيئة، وأضف مثالاً في .env.example'],
  out:'قائمة فحص ما قبل التسليم (صفحة واحدة) طُبّقت على كود المتدرب.',
  trap:{sign:'لصق ملف إعداد فيه مفتاح حقيقي في المهمة',say:'تمرين إلزامي: كل متدرب يبحث في مستودعه عن مفتاح مكشوف قبل نهاية الجلسة. من وجد مفتاحاً يُبطله فوراً.'}},
 {t:'مشروع التخرج وقياس الأثر',goal:'يسلّم المتدرب ميزة كاملة من مشروعه بمعايير انتهاء مكتوبة، ويقيس ما تغيّر في وقته.',
  min:[[0,15,'عرض الخطط ومعايير الانتهاء'],[15,60,'العمل على المشروع ومراجعة المدرّب فرداً فرداً'],[60,80,'العروض: الفرق، الاختبارات، ما رُفض من اقتراحات الأداة'],[80,90,'بطاقة التقييم + خطة الثلاثين يوماً القادمة']],
  prompts:['اكتب وصف طلب الدمج: ما تغيّر، كيف يُجرَّب، وما لم يُنجز','أنشئ قائمة فحص للمراجع تطابق معايير الانتهاء التي كتبتها'],
  out:'طلب دمج مدموج في مشروع المتدرب + بطاقة تقييم ممتلئة.',
  trap:{sign:'المتدرب يعرض ما بنته الأداة ولا يشرح قراراته',say:'في العرض يُسأل سؤالان ثابتان: أي اقتراح رفضته ولماذا، وأي اختبار كتبته بنفسك. من لا يجيب لا يُعدّ متقناً حتى لو عمل الكود.'}}
];

/* ================= بطاقة التقييم =================
   خمسة معايير بأوزان مجموعها ١٠٠، كل معيار ٠–٣. */
const RUBRIC=[
 {k:'spec',w:25,t:'صياغة المهمة',lv:['طلب غامض من جملة','يذكر المطلوب دون معيار انتهاء','مهمة فيها سياق ومطلوب ومعيار انتهاء','يضيف الممنوعات وحصر الملفات مسبقاً']},
 {k:'review',w:25,t:'مراجعة الناتج',lv:['يدمج دون قراءة','يقرأ سريعاً ولا يلاحظ ما خرج عن النطاق','يقرأ الفرق سطراً سطراً ويعلّق','يرفض ويعيد الصياغة بسبب مكتوب']},
 {k:'debug',w:20,t:'وصف الخلل والإصلاح',lv:['«ما ضبط» وإعادة الطلب نفسه','يصف الخلل عموماً','يصف ما رآه وما توقّعه ويعزل الملف','يصنع حالة إعادة إنتاج أصغر قبل الإصلاح']},
 {k:'test',w:20,t:'الاختبار قبل التنفيذ',lv:['لا اختبارات','اختبارات كتبتها الأداة ولم تُراجَع','يكتب اختبارات للحالة الطبيعية','يكتب حالات حدّية ويمنع تعديل الاختبارات']},
 {k:'safety',w:10,t:'الأمان والأسرار',lv:['يلصق أسراراً في المهام','يعرف القاعدة ولا يطبّقها','لا أسرار في الكود ويستخدم متغيرات البيئة','يفحص الفرق أمنياً قبل التسليم']}
];
const LEVELS=[[85,'متقدّم: يعمل بإشراف خفيف','ok'],[70,'متوسط: يحتاج مراجعة على التعديلات الكبيرة','ok'],[55,'مبتدئ متقدّم: يحتاج متابعة في كل مهمة','warn'],[0,'يحتاج دعماً: يُعاد تدريبه على جلستَي الصياغة والمراجعة','bad']];
function rubricScore(sel){ // sel = {k:0..3}
 let s=0; for(const c of RUBRIC) s+=(sel[c.k]||0)/3*c.w;
 return Math.round(s);
}
function levelOf(score){ for(const [min,label,cls] of LEVELS) if(score>=min) return {min,label,cls}; }
function weakest(sel){ // أقل معيار بعد ترجيح الأثر، لتوليد جملة الملاحظة
 let worst=null;
 for(const c of RUBRIC){const v=sel[c.k]||0; const loss=(3-v)/3*c.w; if(!worst||loss>worst.loss) worst={c,v,loss};}
 return worst;
}
function feedback(sel){
 const sc=rubricScore(sel), lv=levelOf(sc), w=weakest(sel);
 const strong=RUBRIC.filter(c=>(sel[c.k]||0)===3).map(c=>c.t);
 let s=`الدرجة ${sc}/100 — ${lv.label}.`;
 if(strong.length) s+=` أتقن: ${strong.join('، ')}.`;
 if(w.loss>0) s+=` الخطوة القادمة: ${w.c.t} — المستوى المطلوب «${w.c.lv[Math.min(w.v+1,3)]}».`;
 else s+=' لا توجد فجوة في المعايير الخمسة.';
 return s;
}

/* ================= لوحة متابعة المتدربين =================
   حضور/تسليم لكل جلسة: p=حاضر ومسلّم، a=غائب، l=حاضر بلا تسليم */
const TRAINEES=[
 {n:'ريان ع.',track:'kids',m:['p','p','p','p','p','p'],sc:{spec:3,review:2,debug:3,test:2,safety:3}},
 {n:'لمى س.',track:'kids',m:['p','p','l','p','p','p'],sc:{spec:2,review:2,debug:2,test:2,safety:3}},
 {n:'عبدالله ح.',track:'kids',m:['p','a','a','l','p','p'],sc:{spec:1,review:1,debug:1,test:0,safety:2}},
 {n:'نورة م.',track:'kids',m:['p','p','p','l','l','p'],sc:{spec:2,review:1,debug:2,test:1,safety:2}},
 {n:'م. سلطان ف.',track:'adults',m:['p','p','p','p','p','p'],sc:{spec:3,review:3,debug:3,test:3,safety:3}},
 {n:'م. هند ق.',track:'adults',m:['p','p','p','l','p','p'],sc:{spec:3,review:2,debug:2,test:2,safety:2}},
 {n:'م. فهد ب.',track:'adults',m:['p','l','a','a','l','l'],sc:{spec:1,review:1,debug:2,test:0,safety:1}},
 {n:'م. ريم ط.',track:'adults',m:['p','p','l','l','p','p'],sc:{spec:2,review:2,debug:2,test:1,safety:3}}
];
const done=t=>t.m.filter(x=>x==='p').length;
const pct=t=>Math.round(done(t)/t.m.length*100);
function risk(t){ // متعثر: غيابان متتاليان، أو درجة تحت ٥٥، أو تسليمان ناقصان متتاليان
 const sc=rubricScore(t.sc);
 for(let i=1;i<t.m.length;i++){
  if(t.m[i]==='a'&&t.m[i-1]==='a') return {yes:true,why:'غيابان متتاليان'};
  if(t.m[i]!=='p'&&t.m[i-1]!=='p') return {yes:true,why:'جلستان بلا تسليم'};
 }
 if(sc<55) return {yes:true,why:`الدرجة ${sc} تحت ٥٥`};
 return {yes:false,why:''};
}

/* ================= العرض ================= */
let view=(location.hash||'#kids').slice(1);
if(!['kids','adults','eval','track','upd'].includes(view))view='kids';
const sel={spec:2,review:1,debug:2,test:1,safety:2};
let trackFilter='all';

function sessCard(s,i,len,openFirst){
 const total=s.min[s.min.length-1][1];
 return `<details class="sess"${openFirst&&i===0?' open':''}>
 <summary>الجلسة ${i+1}: ${esc(s.t)} <small>— ${total} دقيقة</small></summary>
 <div class="body">
  <p><b>الهدف:</b> ${esc(s.goal)}</p>
  <h3>سير الجلسة</h3>
  <div class="tl">${s.min.map(([a,b,l])=>`<b><num>${a}–${b}</num></b><span>${esc(l)}</span>`).join('')}</div>
  <h3>المهام التي يكتبها المتدرب بنفسه</h3>
  ${s.prompts.map(p=>`<pre>${esc(p)}</pre>`).join('')}
  <h3>ما يخرج به المتدرب</h3><p>${esc(s.out)}</p>
  <h3>العقبة المتوقعة وما يفعله المدرّب</h3>
  <p><span class="tag warn">العلامة</span> ${esc(s.trap.sign)}<br><span class="tag ok">التصرّف</span> ${esc(s.trap.say)}</p>
 </div></details>`;
}

function vTrack(list,title,sub,rules){
 return `<div class="card"><h1>${title}</h1><p class="hint">${sub}</p>
  <p>${rules.map(r=>`<span class="tag neu">${esc(r)}</span>`).join(' ')}</p></div>
 ${list.map((s,i)=>sessCard(s,i,list.length,true)).join('')}`;
}

function vEval(){
 const sc=rubricScore(sel), lv=levelOf(sc);
 return `<div class="row">
 <div class="card"><h1>بطاقة تقييم المتدرب</h1>
  <p class="hint">خمسة معايير، كل معيار أربعة مستويات موصوفة. الدرجة والملاحظة تُحسبان فوراً، فتُملأ البطاقة أمام المتدرب في آخر جلسة.</p>
  ${RUBRIC.map(c=>`<div class="crit"><label>${esc(c.t)} <span class="hint">— وزن <num>${c.w}</num></span></label>
   <div class="sc" data-k="${c.k}">${c.lv.map((l,i)=>`<button data-v="${i}" class="${(sel[c.k]||0)===i?'on':''}"><num>${i}</num> · ${esc(l)}</button>`).join('')}</div></div>`).join('')}
 </div>
 <div class="card"><h2>النتيجة</h2>
  <p class="big" id="score"><num>${sc}</num>/100</p>
  <div class="bar"><i style="width:${sc}%"></i></div>
  <p><span class="tag ${lv.cls}">${esc(lv.label)}</span></p>
  <h3>الملاحظة المكتوبة للمتدرب</h3>
  <p id="fb">${esc(feedback(sel))}</p>
  <h3>ما تُستخدم فيه</h3>
  <ul><li>تقرير لولي الأمر أو لجهة العمل بلغة محددة لا بعبارات عامة.</li>
   <li>قرار إعادة جلسة بعينها بدل إعادة الدورة كلها.</li>
   <li>مقارنة قبل/بعد لنفس المتدرب في دورة لاحقة.</li></ul>
 </div></div>`;
}

function vTrackBoard(){
 const rows=TRAINEES.filter(t=>trackFilter==='all'||t.track===trackFilter);
 const atRisk=rows.filter(t=>risk(t).yes);
 return `<div class="card"><h1>لوحة متابعة المتدربين</h1>
  <p class="hint">الحضور والتسليم لكل جلسة، ونسبة الإنجاز ودرجة البطاقة محسوبتان. «متعثر» قاعدة مكتوبة لا تقدير: غيابان متتاليان، أو جلستان بلا تسليم، أو درجة تحت ٥٥.</p>
  <p>${[['all','الكل'],['kids','الأطفال'],['adults','الكبار']].map(([k,l])=>`<button class="btn ${trackFilter===k?'':'alt'} sm" data-f="${k}">${l}</button>`).join(' ')}
   &nbsp;<span class="tag ${atRisk.length?'bad':'ok'}">متعثرون: <num>${atRisk.length}</num> من <num>${rows.length}</num></span></p>
  <table><thead><tr><th>المتدرب</th><th>المسار</th><th>الجلسات</th><th>الإنجاز</th><th>الدرجة</th><th>الحالة</th></tr></thead><tbody>
  ${rows.map(t=>{const r=risk(t),s=rubricScore(t.sc);return `<tr>
   <td>${esc(t.n)}</td><td>${t.track==='kids'?'أطفال':'كبار'}</td>
   <td><num>${t.m.map(m=>m==='p'?'●':m==='l'?'◐':'○').join(' ')}</num></td>
   <td><num>${pct(t)}%</num></td><td><num>${s}</num></td>
   <td>${r.yes?`<span class="tag bad">متعثر — ${esc(r.why)}</span>`:'<span class="tag ok">منتظم</span>'}</td></tr>`}).join('')}
  </tbody></table>
  <p class="hint"><num>●</num> حاضر ومسلّم · <num>◐</num> حاضر بلا تسليم · <num>○</num> غائب</p>
  <h3>ماذا يُفعل بالمتعثر</h3>
  <ul><li>رسالة واحدة بعد أول غياب، وجلسة تعويض مسجّلة لا إعادة شرح للمجموعة.</li>
   <li>تسليم مصغّر: خطوة واحدة من الجلسة الفائتة تُقبل بدل المشروع كامل.</li>
   <li>بعد غيابين متتاليين يُبلَّغ منسّق البرنامج، لأن المكان له تكلفة.</li></ul>
 </div>`;
}

function vUpd(){
 return `<div class="card"><h1>كيف تبقى المادة محدّثة</h1>
 <p class="hint">أدوات البرمجة بالذكاء الاصطناعي تتغيّر كل أسابيع. المادة المبنية على لقطات شاشة لواجهة تموت سريعاً، والمبنية على مهارات تبقى.</p>
 <h3>ما لا يتغيّر وما يتغيّر</h3>
 <table><thead><tr><th>طبقة</th><th>أمثلة</th><th>عمرها</th></tr></thead><tbody>
 <tr><td>المهارة</td><td>صياغة المهمة، معيار الانتهاء، قراءة الفرق، وصف الخلل، الاختبار أولاً</td><td>سنوات — هي ٨٠٪ من المادة</td></tr>
 <tr><td>النمط</td><td>ملف تعليمات للمستودع، أوضاع الموافقة، تنفيذ معزول، مهام متوازية</td><td>أشهر</td></tr>
 <tr><td>الواجهة</td><td>أسماء الأوامر، مواضع الأزرار، أسماء النماذج، الحدود والأسعار</td><td>أسابيع — تُعزل في ملحق واحد</td></tr>
 </tbody></table>
 <h3>الإجراء الشهري</h3>
 <ol><li>تشغيل تمارين الجلسات الست على أحدث إصدار، وتسجيل ما تغيّر فعلاً.</li>
  <li>تحديث ملحق الواجهة والأوامر فقط، وتثبيت رقم الإصدار في أول صفحة من دليل المدرّب.</li>
  <li>إعادة تصوير المقاطع المتأثرة وحدها، لا الدورة كلها.</li>
  <li>سجل تغييرات مؤرّخ في الدليل، فيعرف أي مدرّب ما استُجدّ.</li></ol>
 <h3>ما يُسلَّم في الحزمة</h3>
 <ul><li>دليل المدرّب لكل جلسة: الهدف، التوقيت، نص الشرح، العقبات والتصرّف.</li>
  <li>ملف المتدرب: المهام التي يكتبها بنفسه، التمارين، المشروع، ومعايير الانتهاء.</li>
  <li>المشاريع الجاهزة: الصفحات واللعبة والمستودعات التدريبية مع الأخطاء المقصودة.</li>
  <li>بطاقة التقييم ولوحة المتابعة كملف يعمل (الموجود في هذه الصفحة)، لا كصورة.</li>
  <li>قواعد السلامة للأطفال وقائمة فحص ما قبل التسليم للكبار.</li></ul>
 <h3>قيد مذكور صراحةً</h3>
 <p>هذه الحزمة هي <b>المادة ونظام التقييم</b>: تُسلَّم جاهزة ليقدّمها مدرّبكم. تقديم الجلسات المباشرة على الكاميرا والحضور في الرياض أو مكة ليسا جزءاً من هذا العرض.</p>
 </div>`;
}

function render(){
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
 $('#app').innerHTML =
  view==='kids'  ? vTrack(KIDS,'مسار الأطفال (٩–١٤ سنة) — ٦ جلسات × ٤٥ دقيقة','كل جلسة تنتهي بشيء يعمل ويراه الطفل، والمهارة المستهدفة هي وصف المطلوب لا حفظ الأوامر.',['من المتصفح فقط','بلا طرفية','بلا مفاتيح','حساب الجهة لا حسابات الأطفال']) :
  view==='adults'? vTrack(ADULTS,'مسار الكبار — ٦ جلسات × ٩٠ دقيقة','يفترض معرفة بالطرفية وgit. الهدف استخدام احترافي مُراجَع على مستودعات حقيقية.',['فرع جديد دائماً','وضع الاقتراح على الكود الحقيقي','التنفيذ الكامل في بيئة معزولة','لا أسرار في المهام']) :
  view==='eval'  ? vEval() :
  view==='track' ? vTrackBoard() : vUpd();
 if(view==='eval') document.querySelectorAll('.sc').forEach(g=>g.onclick=e=>{
  const b=e.target.closest('button'); if(!b)return; sel[g.dataset.k]=+b.dataset.v; render();
 });
 if(view==='track') document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{trackFilter=b.dataset.f;render()});
}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{view=a.dataset.v;location.hash='#'+view;render()});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==view){view=v;render()}});
render();
</script>
</body>
</html>
