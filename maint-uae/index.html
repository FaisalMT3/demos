<style>
:root{--ink:#10243a;--mut:#5d6b7a;--line:#dde3ea;--bg:#f4f6f8;--card:#fff;--acc:#15616d;--ok:#1d7a3a;--warn:#b25e00;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:15px/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:.7rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
header b{font-size:1.05rem}
nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav a{color:#cfe0ea;text-decoration:none;padding:.25rem .7rem;border-radius:6px;cursor:pointer}
nav a.on{background:#ffffff1f;color:#fff}
.note{background:#fff8e6;border-bottom:1px solid #f0dca8;padding:.45rem 1rem;font-size:.85rem}
main{max-width:1060px;margin:1rem auto;padding:0 1rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem;overflow-x:auto}
h1{font-size:1.3rem;margin:.2rem 0 .8rem}h2{font-size:1.05rem;margin:.2rem 0 .6rem}h3{font-size:.95rem;margin:.9rem 0 .3rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem}
.stat span{display:block;color:var(--mut);font-size:.85rem}.stat b{font-size:1.6rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:.5rem .45rem;border-bottom:1px solid var(--line);vertical-align:top;font-size:.92rem}
th{color:var(--mut);font-weight:600;font-size:.85rem}
.tag{display:inline-block;padding:0 .5rem;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.ok{color:var(--ok);background:#e5f3e9}.warn{color:var(--warn);background:#fdf0e1}.bad{color:var(--bad);background:#fbe7e6}.neu{color:var(--mut);background:#eef1f4}
a{color:var(--acc)}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:.5rem 1rem;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.alt{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:.25rem .6rem;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.hide-sm{display:none}table{font-size:.88rem;min-width:430px}}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.2rem;margin-top:.6rem}
input,select,textarea{width:100%;font:inherit;padding:.5rem;border:1px solid var(--line);border-radius:8px;background:#fff}
.hint{color:var(--mut);font-size:.82rem;font-weight:400}
.err{color:var(--bad);font-size:.85rem;font-weight:600}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.chips label{display:inline-flex;gap:.3rem;align-items:center;margin:0;font-weight:400;border:1px solid var(--line);border-radius:99px;padding:.2rem .6rem;background:#fff;cursor:pointer}
.chips input{width:auto}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:.6rem;counter-reset:s}
.flow div{border:1px solid var(--line);border-radius:8px;padding:.6rem;background:#fafcfc;font-size:.9rem}
.flow div::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--acc);color:#fff;font-size:.8rem;margin-inline-end:.4rem}
.quote{border:1px solid var(--line);border-radius:10px;padding:.7rem;background:#fafcfc}
.quote.best{border-color:var(--acc);box-shadow:0 0 0 2px #15616d22}
.quote b{font-size:1.25rem}
.switch{display:flex;gap:.5rem;align-items:center;background:#eef6f7;border:1px solid #cfe3e6;border-radius:8px;padding:.5rem .7rem;margin:.6rem 0}
.switch input{width:auto}
ul{margin:.3rem 0;padding-inline-start:1.2rem}li{margin-bottom:.25rem}
code{font-family:ui-monospace,monospace;font-size:.85em;direction:ltr;unicode-bidi:isolate}
.wm{position:fixed;inset-inline-end:.6rem;inset-block-end:.6rem;background:#10243ae6;color:#fff;font-size:.78rem;padding:.3rem .6rem;border-radius:99px;z-index:9;pointer-events:none}
.stamp{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:8;overflow:hidden}
.stamp span{font:700 clamp(2rem,9vw,5rem)/1 "IBM Plex Sans Arabic",sans-serif;color:#10243a;opacity:.055;transform:rotate(-24deg);white-space:nowrap}
.photo{width:92px;height:70px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#eef1f4}

<header><b>🔧 منصة خدمات الصيانة</b>

<a data-v="client" class="on">صفحة العميل</a><a data-v="company">صفحة الشركة</a><a data-v="admin">لوحة المدير</a><a data-v="scope">نطاق النسخة الأولى</a>
</nav></header>
<div class="note">نموذج يعمل فعلًا: أرسل طلبًا من صفحة العميل، قدّم عرض سعر من صفحة الشركة، ثم قارن واختر. البيانات وهمية وتُحفظ في متصفحك وحده. <a id="reset">إعادة البيانات</a></div>
<main id="app"></main>
<div class="stamp"><span>نموذج عرض — فيصل فهد</span></div>
<div class="wm">نموذج — فيصل فهد المطيري</div>
<script>
const EMIRATES={
 'أبوظبي':['مدينة أبوظبي','المصفح','الشامخة','خليفة A','الريم','العين','مدينة زايد'],
 'دبي':['ديرة','بر دبي','القوز','الخوانيج','دبي مارينا','الورقاء','جبل علي','ند الشبا'],
 'الشارقة':['المجاز','القاسمية','مويلح','الناصرية','الرملة','خورفكان'],
 'عجمان':['الراشدية','النعيمية','الجرف','المويهات'],
 'أم القيوين':['الرأس','الرملة','السلمة'],
 'رأس الخيمة':['النخيل','الدقداقة','الجزيرة الحمراء','الرمس'],
 'الفجيرة':['الفجيرة المدينة','دبا','مربح']};
const SERVICES=['أنظمة الحريق (فاير)','تكييف','كهرباء','سباكة','صيانة عامة'];
const ST={new:'جديد',quoted:'توجد عروض',chosen:'تم اختيار شركة',done:'مكتمل',cancelled:'ملغي',stale:'انتهى بلا عروض'};
const STC={new:'neu',quoted:'warn',chosen:'ok',done:'ok',cancelled:'bad',stale:'bad'};
const STALE_HOURS=48; // the state his spec is missing: a request nobody bid on must stop looking "new"

const SEED={
 settings:{showBudget:false},
 companies:[
  {id:'P1',name:'الواحة للصيانة العامة',phone:'0501234501',email:'ops@alwaha.ae',trn:'100123456700003',services:['تكييف','كهرباء','صيانة عامة'],areas:['دبي','الشارقة'],status:'active'},
  {id:'P2',name:'مؤسسة الخليج لأنظمة الحريق',phone:'0501234502',email:'info@gulffire.ae',trn:'100987654300003',services:['أنظمة الحريق (فاير)','كهرباء'],areas:['دبي','أبوظبي'],status:'active'},
  {id:'P3',name:'نجم السباكة الحديثة',phone:'0501234503',email:'najm@plumb.ae',trn:'',services:['سباكة','صيانة عامة'],areas:['عجمان','الشارقة'],status:'pending'}],
 requests:[
  {id:'R-1007',name:'سعيد المرزوقي',phone:'0551110001',service:'تكييف',emirate:'دبي',area:'الورقاء',desc:'مكيف الصالة يشتغل ولا يبرد، والفاتورة ارتفعت الشهرين الماضيين.',budget:900,when:'2026-10-13',photo:'',status:'quoted',created:Date.now()-26*36e5},
  {id:'R-1008',name:'مريم الحمادي',phone:'0551110002',service:'أنظمة الحريق (فاير)',emirate:'دبي',area:'القوز',desc:'مستودع يحتاج فحص دوري لنظام الإنذار والطفايات قبل زيارة الدفاع المدني.',budget:2500,when:'2026-10-15',photo:'',status:'new',created:Date.now()-3*36e5},
  {id:'R-1009',name:'عبدالله الشامسي',phone:'0551110003',service:'سباكة',emirate:'عجمان',area:'النعيمية',desc:'تسريب أسفل مغسلة المطبخ، الماء يصل للخزانة.',budget:400,when:'2026-10-12',photo:'',status:'new',created:Date.now()-61*36e5}],
 quotes:[
  {id:'Q-1',req:'R-1007',company:'P1',price:850,when:'2026-10-13',notes:'فحص الغاز وتنظيف المكثف، وضمان شهر على العمل.',created:Date.now()-20*36e5},
  {id:'Q-2',req:'R-1007',company:'P2',price:1100,when:'2026-10-12',notes:'زيارة غدًا، والسعر يشمل كيلو غاز إن احتاج.',created:Date.now()-18*36e5}],
 log:[]};

let db=JSON.parse(localStorage.maintuae||'null')||structuredClone(SEED);
const save=()=>localStorage.maintuae=JSON.stringify(db);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=s=>`<bdi dir="ltr">${s}</bdi>`;
const co=id=>db.companies.find(c=>c.id===id);
const req=id=>db.requests.find(r=>r.id===id);
const quotesOf=id=>db.quotes.filter(q=>q.req===id).sort((a,b)=>a.price-b.price);
const money=n=>L(Number(n).toLocaleString('en-US')+' د.إ');
const hoursAgo=t=>Math.round((Date.now()-t)/36e5);
const ago=t=>{const h=hoursAgo(t);return h<1?'قبل دقائق':h<24?`قبل ${h} ساعة`:`قبل ${Math.round(h/24)} يوم`};
const nextId=(pre,arr)=>pre+(arr.reduce((m,x)=>Math.max(m,+String(x.id).split('-')[1]||0),1000)+1);
const logit=t=>{db.log.unshift({t:Date.now(),text:t});db.log=db.log.slice(0,12)};

// A request that is still "new" past STALE_HOURS with zero quotes is dead, not new.
function state(r){
  if(r.status!=='new') return r.status;
  if(quotesOf(r.id).length) return 'quoted';
  return hoursAgo(r.created)>=STALE_HOURS?'stale':'new';
}
const badge=r=>{const s=state(r);return `<span class="tag ${STC[s]}">${ST[s]}</span>`};

let view=(location.hash||'#client').slice(1);
if(!['client','company','admin','scope'].includes(view))view='client';
let actor=null, pickReq=null;

function render(){
 [...document.querySelectorAll('#nav a')].forEach(a=>a.classList.toggle('on',a.dataset.v===view));
 $('#app').innerHTML={client:vClient,company:vCompany,admin:vAdmin,scope:vScope}[view]();
 wire();
}

/* ---------- client ---------- */
function vClient(){
 const mine=db.requests.filter(r=>r.phone===(actor&&actor.phone)||false);
 return `
 <div class="card">
  <h1>اطلب فني أو شركة صيانة</h1>
  <p class="hint">اكتب المشكلة، وتصلك عروض من شركات معتمدة في منطقتك، فتقارن السعر والموعد وتختار.</p>
  <div class="grid2">
   <div><label>الاسم</label><input id="c-name" placeholder="الاسم الكامل"></div>
   <div><label>رقم الهاتف</label><input id="c-phone" inputmode="tel" placeholder="05xxxxxxxx"></div>
   <div><label>نوع الخدمة</label><select id="c-service">${SERVICES.map(s=>`<option>${s}</option>`).join('')}</select></div>
   <div><label>الموعد المناسب</label><input id="c-when" type="date" value="2026-10-14"></div>
   <div><label>الإمارة</label><select id="c-em">${Object.keys(EMIRATES).map(e=>`<option>${e}</option>`).join('')}</select></div>
   <div><label>المنطقة</label><select id="c-area"></select></div>
   <div><label>الميزانية المتوقعة (درهم)</label><input id="c-budget" type="number" min="0" step="50" placeholder="مثال: 800">
    <span class="hint">تُستخدم للفرز الداخلي فقط. الشركات لا تراها في الإعداد الحالي، حتى لا تأتي كل العروض بسعر الميزانية.</span></div>
   <div><label>صورة للمشكلة (اختياري)</label><input id="c-photo" type="file" accept="image/*"></div>
  </div>
  <label>وصف المشكلة</label><textarea id="c-desc" rows="3" placeholder="اكتب ما تراه: متى بدأت، وأي جزء، وهل تكررت"></textarea>
  <p id="c-err" class="err"></p>
  <p><button class="btn" id="c-send">أرسل الطلب</button></p>
 </div>
 ${actor&&actor.phone?`<div class="card"><h2>طلباتي <span class="hint">(${esc(actor.phone)})</span></h2>
   ${mine.length?mine.map(r=>cardReq(r)).join(''):'<p class="hint">لا توجد طلبات بهذا الرقم.</p>'}</div>`:
   `<div class="card"><h2>تابع طلبك</h2><p class="hint">اكتب رقم هاتفك لتظهر طلباتك والعروض المقدمة عليها، بدون كلمة مرور.</p>
    <div class="grid2"><div><input id="t-phone" placeholder="05xxxxxxxx" value="0551110001"></div><div><button class="btn alt" id="t-go">اعرض طلباتي</button></div></div></div>`}`;
}
function cardReq(r){
 const qs=quotesOf(r.id), chosen=qs.find(q=>q.id===r.chosen);
 return `<div class="card" style="background:#fafcfc">
  <h3>${esc(r.id)} · ${esc(r.service)} · ${esc(r.emirate)} / ${esc(r.area)} ${badge(r)}</h3>
  <p>${esc(r.desc)}</p>
  <p class="hint">الموعد المطلوب ${L(esc(r.when))} · أُرسل ${ago(r.created)} · الميزانية ${money(r.budget)}</p>
  ${r.photo?`<img class="photo" src="${r.photo}" alt="صورة المشكلة">`:''}
  ${chosen?`<p class="tag ok">تم اختيار ${esc(co(chosen.company).name)} بسعر ${money(chosen.price)}</p>
    <p class="hint">بيانات التواصل تظهر للطرفين بعد الاختيار: ${L(esc(co(chosen.company).phone))}</p>`:
   qs.length?`<h3>العروض المقدمة (${qs.length})</h3><div class="grid3">${qs.map((q,i)=>`
    <div class="quote ${i===0?'best':''}">
     <b>${money(q.price)}</b>${i===0?' <span class="tag ok">الأقل سعرًا</span>':''}
     <p class="hint">${esc(co(q.company).name)} · التنفيذ ${L(esc(q.when))}</p>
     <p>${esc(q.notes)}</p>
     <button class="btn sm" data-choose="${q.id}">اختر هذا العرض</button>
    </div>`).join('')}</div>`:
   `<p class="hint">لا عروض بعد.${state(r)==='stale'?' مضى أكثر من يومين بلا عرض واحد، فالطلب يُعرض على المدير لإعادة توجيهه.':''}</p>`}
 </div>`;
}

/* ---------- company ---------- */
function vCompany(){
 const act=db.companies.filter(c=>c.status==='active');
 if(!actor||!actor.cid){
  return `<div class="card"><h1>صفحة شركات الصيانة</h1>
   <p class="hint">في النظام الحقيقي تسجّل الشركة حسابها ويُفعّله المدير. هنا اختر شركة لتدخل بصفتها، أو سجّل شركة جديدة فتظهر للمدير بانتظار التفعيل.</p>
   <label>ادخل بصفة شركة مفعّلة</label>
   <select id="p-as">${act.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
   <p><button class="btn" id="p-go">دخول</button></p>
   <h2>تسجيل شركة جديدة</h2>
   <div class="grid2">
    <div><label>اسم الشركة</label><input id="p-name"></div>
    <div><label>هاتف التواصل</label><input id="p-phone" inputmode="tel"></div>
    <div><label>البريد</label><input id="p-email" type="email"></div>
    <div><label>الرقم الضريبي (TRN) <span class="hint">اختياري</span></label><input id="p-trn"></div>
   </div>
   <label>التخصص</label><div class="chips">${SERVICES.map(s=>`<label><input type="checkbox" name="p-srv" value="${s}">${s}</label>`).join('')}</div>
   <label>المناطق التي تخدمها</label><div class="chips">${Object.keys(EMIRATES).map(e=>`<label><input type="checkbox" name="p-ar" value="${e}">${e}</label>`).join('')}</div>
   <p id="p-err" class="err"></p>
   <p><button class="btn alt" id="p-reg">أرسل طلب التسجيل</button></p></div>`;
 }
 const me=co(actor.cid);
 // open = still unassigned; "انتهى بلا عروض" is an admin signal, it must not hide the request from companies
 const open=db.requests.filter(r=>!['chosen','done','cancelled'].includes(r.status)&&me.services.includes(r.service)&&me.areas.includes(r.emirate));
 const mineQ=db.quotes.filter(q=>q.company===me.id);
 return `<div class="card"><h1>${esc(me.name)} <span class="tag ok">مفعّلة</span></h1>
  <p class="hint">التخصص: ${me.services.map(esc).join(' · ')} — المناطق: ${me.areas.map(esc).join(' · ')}
  <br>لا تظهر لك إلا الطلبات التي تطابق تخصصك ومناطقك. <a id="p-out">تسجيل خروج</a></p></div>
 <div class="stats"><div class="stat"><span>طلبات مفتوحة تناسبك</span><b>${open.length}</b></div>
  <div class="stat"><span>عروضك المقدمة</span><b>${mineQ.length}</b></div>
  <div class="stat"><span>عروض مقبولة</span><b>${db.requests.filter(r=>r.chosen&&db.quotes.find(q=>q.id===r.chosen&&q.company===me.id)).length}</b></div></div>
 <div class="card"><h2>الطلبات المفتوحة</h2>
 ${open.length?open.map(r=>{const mq=mineQ.find(q=>q.req===r.id);return `
  <div class="card" style="background:#fafcfc"><h3>${esc(r.id)} · ${esc(r.service)} · ${esc(r.emirate)} / ${esc(r.area)}</h3>
   <p>${esc(r.desc)}</p>
   <p class="hint">الموعد المطلوب ${L(esc(r.when))} · ${ago(r.created)} · عدد العروض ${quotesOf(r.id).length}
    · الميزانية ${db.settings.showBudget?money(r.budget):'<span class="tag neu">غير معروضة</span>'}</p>
   ${r.photo?`<img class="photo" src="${r.photo}" alt="">`:''}
   ${mq?`<p class="tag ok">قدّمت عرضًا بـ ${money(mq.price)} للتنفيذ ${L(esc(mq.when))}</p>`:`
   <div class="grid3">
    <div><label>السعر (درهم)</label><input type="number" min="0" step="50" data-q="price" data-r="${r.id}"></div>
    <div><label>موعد التنفيذ</label><input type="date" data-q="when" data-r="${r.id}" value="2026-10-14"></div>
    <div><label>ملاحظات مختصرة</label><input data-q="notes" data-r="${r.id}" placeholder="ما يشمله السعر"></div>
   </div><p><button class="btn sm" data-quote="${r.id}">أرسل عرض السعر</button></p>`}
  </div>`}).join(''):'<p class="hint">لا طلبات مفتوحة تطابق تخصصك ومناطقك الآن.</p>'}
 </div>`;
}

   <td><span class="tag ${c.status==='active'?'ok':c.status==='pending'?'warn':'bad'}">${c.status==='active'?'مفعّلة':c.status==='pending'?'بانتظار المراجعة':'مرفوضة'}</span></td>

 <div class="card"><h2>مراجعة عروض الأسعار</h2>

  ${db.quotes.length?db.quotes.map(q=>`<tr><td>${esc(q.id)}</td><td>${esc(q.req)}</td><td>${esc(co(q.company).name)}</td>

/* ---------- scope ---------- */
function vScope(){return `
<div class="card"><h1>نطاق النسخة الأولى، كما كُتب في الطلب</h1>
 <div class="flow">
  <div>العميل يكتب الطلب: الخدمة، الإمارة والمنطقة، الوصف، الميزانية، الموعد، صورة</div>
  <div>تسجيل الشركة وتخصصها ومناطقها، ومراجعة الإدارة قبل التفعيل</div>
  <div>الشركات المفعّلة ترى الطلبات المطابقة وتقدّم عرض سعر</div>
  <div>العميل يقارن العروض بالسعر والموعد ويختار</div>
  <div>لوحة المدير: الطلبات، الشركات، العروض، حالة كل طلب</div>
  <div>التسليم: الكود المصدري وقاعدة البيانات ودخول الإدارة، على حساباتك</div>
 </div>
 <p class="hint">كل ما سبق مُنفَّذ في هذا النموذج ويعمل أمامك. ما استُثني في الطلب لم يُبنَ: لا تطبيق جوال، ولا دفع إلكتروني، ولا محادثات داخلية، ولا اشتراكات آلية، ولا ذكاء اصطناعي، ولا فواتير، ولا خرائط متقدمة ولا إشعارات واتساب.</p>
</div>
<div class="card"><h2>أربعة أمور تظهر عند التنفيذ لا في الوصف</h2>
 <h3>١. الميزانية المعروضة تُفسد المقارنة</h3>
 <p>إذا رأت الشركات ميزانية العميل، جاء أكثر العروض عند سقف الميزانية نفسه، فتصير المقارنة بين أسعار متشابهة لا بين عروض حقيقية. لذلك الميزانية في هذا النموذج للفرز الداخلي فقط، مع مفتاح في لوحة المدير يفتحها إن أردت، فالقرار قرارك بعد أن تراه يعمل.</p>
 <h3>٢. حالة ناقصة في قائمة الحالات</h3>
 <p>الحالات المطلوبة خمس: جديد، توجد عروض، تم اختيار شركة، مكتمل، ملغي. الطلب الذي لم يقدّم عليه أحد يبقى «جديدًا» إلى الأبد، فلا تفرّق بين طلب عمره خمس دقائق وطلب عمره ستة أيام بلا عرض واحد. أضفت حالة سادسة «انتهى بلا عروض» بعد ${STALE_HOURS} ساعة، وعدّادًا لها في لوحة المدير، لأن هذه الطلبات هي أول ما يحتاج تدخّل الإدارة.</p>
 <h3>٣. المنطقة نص حر = مطابقة لا تعمل</h3>
 <p>العميل يحدد إمارة ومنطقة، والشركة تحدد مناطق تخدمها. إن كان الاثنان كتابة حرة فلن يتطابقا أبدًا («ديره» و«الديرة» و«Deira»). لذلك القائمة ثابتة: سبع إمارات ومناطقها، تُعتمد قبل إدخال أول شركة. تغييرها بعد تسجيل الشركات يعني مراجعة كل حساب من جديد.</p>
 <h3>٤. العميل بلا كلمة مرور، ومع ذلك يتابع طلبه</h3>
 <p>لا يُطلب من العميل حساب ولا كلمة مرور، فالاسم والهاتف فقط كما في الطلب. ومتابعة الطلب تكون برابط خاص بالطلب نفسه يُرسل له، أو بإدخال رقمه كما في هذا النموذج. وبيانات التواصل بين الطرفين لا تظهر إلا بعد اختيار العرض، فلا تُجمع أرقام العملاء من الشركات قبل التعاقد.</p>
</div>
<div class="card"><h2>ما بعد النسخة الأولى، إن احتجته لاحقًا</h2>
 <ul><li>إشعار الشركات بالطلب الجديد عبر البريد أو واتساب، بدل انتظار فتحها للموقع.</li>
 <li>تقييم العميل للشركة بعد الإنجاز، وهو ما يجعل المقارنة تتجاوز السعر.</li>
 <li>عمولة أو اشتراك للشركات، وهو ما يحتاج دفعًا إلكترونيًا وفواتير.</li></ul>
 <p class="hint">لم يُدخل شيء من هذا في سعر النسخة الأولى ولا في مدتها.</p>
</div>`;}

/* ---------- wiring ---------- */
function wire(){
 const areas=()=>{const e=$('#c-em').value;$('#c-area').innerHTML=EMIRATES[e].map(a=>`<option>${a}</option>`).join('')};
 if($('#c-em')){areas();$('#c-em').onchange=areas}
 if($('#c-send'))$('#c-send').onclick=()=>{
  const v=k=>($('#c-'+k).value||'').trim();
  if(!v('name')||!v('phone')||!v('desc'))return $('#c-err').textContent='الاسم والهاتف ووصف المشكلة مطلوبة.';
  if(!/^0\d{8,9}$/.test(v('phone')))return $('#c-err').textContent='رقم الهاتف يبدأ بصفر ويتكون من ٩ أو ١٠ أرقام.';
  const f=$('#c-photo').files[0];
  const add=photo=>{
   const r={id:nextId('R-',db.requests),name:v('name'),phone:v('phone'),service:v('service'),emirate:v('em'),area:v('area'),
    desc:v('desc'),budget:+v('budget')||0,when:v('when'),photo:photo||'',status:'new',created:Date.now()};
   db.requests.unshift(r);logit(`طلب جديد ${r.id} (${r.service} — ${r.emirate})`);actor={phone:r.phone};save();render();
  };
  if(f&&f.size>3e6)return $('#c-err').textContent='حجم الصورة أكبر من ٣ ميجابايت.';
  if(f){const rd=new FileReader();rd.onload=()=>add(rd.result);rd.readAsDataURL(f)}else add('');
 };
 if($('#t-go'))$('#t-go').onclick=()=>{actor={phone:$('#t-phone').value.trim()};render()};
 document.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{
  const q=db.quotes.find(x=>x.id===b.dataset.choose),r=req(q.req);
  r.chosen=q.id;r.status='chosen';logit(`${r.id}: اختار العميل ${co(q.company).name} بسعر ${q.price}`);save();render();
 });
 if($('#p-go'))$('#p-go').onclick=()=>{actor={cid:$('#p-as').value};render()};
 if($('#p-out'))$('#p-out').onclick=()=>{actor=null;render()};
 if($('#p-reg'))$('#p-reg').onclick=()=>{
  const g=n=>[...document.querySelectorAll(`[name=${n}]:checked`)].map(x=>x.value);
  const name=$('#p-name').value.trim(),phone=$('#p-phone').value.trim(),srv=g('p-srv'),ar=g('p-ar');
  if(!name||!phone||!srv.length||!ar.length)return $('#p-err').textContent='الاسم والهاتف وتخصص واحد ومنطقة واحدة على الأقل مطلوبة.';
  const c={id:'P'+(db.companies.length+1),name,phone,email:$('#p-email').value.trim(),trn:$('#p-trn').value.trim(),services:srv,areas:ar,status:'pending'};
  db.companies.push(c);logit(`تسجيل شركة جديدة ${c.name} بانتظار المراجعة`);save();view='admin';location.hash='#admin';render();
 };
 document.querySelectorAll('[data-quote]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.quote,get=k=>document.querySelector(`[data-q=${k}][data-r="${id}"]`).value;
  const price=+get('price');if(!price)return alert('اكتب سعرًا للعرض.');
  const q={id:nextId('Q-',db.quotes),req:id,company:actor.cid,price,when:get('when'),notes:get('notes').trim()||'بدون ملاحظات',created:Date.now()};
  db.quotes.push(q);const r=req(id);if(r.status==='new')r.status='quoted';
  logit(`${co(actor.cid).name} قدّمت عرضًا على ${id} بسعر ${price}`);save();render();
 });
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{co(b.dataset.act).status='active';logit(`تفعيل ${co(b.dataset.act).name}`);save();render()});
 document.querySelectorAll('[data-rej]').forEach(b=>b.onclick=()=>{co(b.dataset.rej).status='rejected';save();render()});
 document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{req(b.dataset.done).status='done';logit(`${b.dataset.done}: مكتمل`);save();render()});
 document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{req(b.dataset.cancel).status='cancelled';save();render()});
 if($('#sb'))$('#sb').onchange=e=>{db.settings.showBudget=e.target.checked;save();render()};
}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{view=a.dataset.v;location.hash='#'+view;render()});
$('#reset').onclick=()=>{localStorage.removeItem('maintuae');db=structuredClone(SEED);actor=null;render()};
render();
</script>
</body>
