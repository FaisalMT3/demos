<body>
<header><b>❄ نظام صيانة المكيفات</b>
<nav><a href="#admin" data-v="admin">لوحة الإدارة</a><a href="#tech" data-v="tech">شاشة الفني</a><a href="#design" data-v="design">مرحلة التحليل</a></nav></header>
<div class="note">نموذج توضيحي: البيانات وهمية وتُحفظ في متصفحك فقط. امسح رمز QR لأي مكيف بالجوال لتفتح ملفه، ثم سجّل زيارة وشاهد التقرير. <a href="#" id="reset">إعادة البيانات</a></div>
<main id="app"></main>
<script>
const SEED={
 clients:[{id:'C1',name:'مجمع الندى السكني',city:'الرياض',phone:'0500000001'},{id:'C2',name:'عيادات سما الطبية',city:'الرياض',phone:'0500000002'},{id:'C3',name:'مطعم بيت الشاورما',city:'الخرج',phone:'0500000003'}],
 techs:['أحمد السالم','سعيد القحطاني','خالد العتيبي'],
 units:[
  {id:'AC-0001',client:'C1',place:'العمارة ٢، الشقة ٤، الصالة',type:'سبليت',brand:'Gree',btu:24000,gas:'R410A',ratedA:9.5,every:90},
  {id:'AC-0002',client:'C1',place:'العمارة ٢، الشقة ٤، غرفة النوم',type:'سبليت',brand:'Gree',btu:18000,gas:'R410A',ratedA:7.2,every:90},
  {id:'AC-0003',client:'C2',place:'الاستقبال، الدور الأرضي',type:'كاسيت',brand:'LG',btu:36000,gas:'R410A',ratedA:14,every:60},
  {id:'AC-0004',client:'C2',place:'غرفة الأشعة',type:'سبليت',brand:'Samsung',btu:24000,gas:'R410A',ratedA:9.8,every:60},
  {id:'AC-0005',client:'C3',place:'المطبخ',type:'شباك',brand:'Zamil',btu:18000,gas:'R410A',ratedA:8.5,every:45}],
 visits:[
  {id:'V-1001',unit:'AC-0001',tech:'أحمد السالم',date:'2026-07-02',suction:128,supplyT:13,returnT:24,amps:8.9,filter:'نظيف',work:'تنظيف فلاتر وفحص تصريف',notes:'',photos:[]},
  {id:'V-1002',unit:'AC-0003',tech:'سعيد القحطاني',date:'2026-09-20',suction:104,supplyT:17,returnT:23,amps:15.8,filter:'يحتاج تبديل',work:'فحص دوري',notes:'فرق الحرارة منخفض وتيار أعلى من المقنن، يُقترح فحص كمية الغاز',photos:[]},
  {id:'V-1003',unit:'AC-0005',tech:'خالد العتيبي',date:'2026-08-01',suction:132,supplyT:12,returnT:23,amps:8.1,filter:'متسخ وتم تنظيفه',work:'غسيل كامل للوحدة',notes:'',photos:[]}]};
// Limits the admin can edit per gas type in the real system (here R410A, cooling mode).
const LIMITS={suction:[110,145],dT:[8,14],ampsOver:1.1};
let db=JSON.parse(localStorage.acdb||'null')||structuredClone(SEED);
const save=()=>localStorage.acdb=JSON.stringify(db);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const client=id=>db.clients.find(c=>c.id===id), unit=id=>db.units.find(u=>u.id===id);
const visitsOf=id=>db.visits.filter(v=>v.unit===id).sort((a,b)=>b.date.localeCompare(a.date));
const today=()=>new Date().toLocaleDateString('en-CA'); // local date, not UTC
const L=s=>`<bdi dir="ltr">${s}</bdi>`; // keeps numbers+units in order inside Arabic
const addDays=(d,n)=>new Date(new Date(d).getTime()+n*864e5).toISOString().slice(0,10);

function evaluate(v,u){ // -> [{label,value,unit,res:'ok'|'warn'|'bad',why}]
 const dT=+(v.returnT-v.supplyT).toFixed(1), ar=v.amps/u.ratedA, r=[];
 r.push({label:'ضغط السحب',value:v.suction,unit:'psi',res:v.suction<LIMITS.suction[0]?'warn':v.suction>LIMITS.suction[1]?'warn':'ok',why:L(`${LIMITS.suction[0]}–${LIMITS.suction[1]} psi`)});
 r.push({label:'فرق الحرارة (راجع − خارج)',value:dT,unit:'°C',res:dT<LIMITS.dT[0]||dT>LIMITS.dT[1]?'warn':'ok',why:L(`${LIMITS.dT[0]}–${LIMITS.dT[1]} °C`)});
 r.push({label:'تيار الضاغط',value:v.amps,unit:'A',res:ar>LIMITS.ampsOver?'bad':'ok',why:'المقنن '+L(u.ratedA+' A')});
 r.push({label:'حالة الفلتر',value:v.filter,unit:'',res:v.filter==='يحتاج تبديل'?'warn':'ok',why:''});
 return r;
}
const overall=r=>r.some(x=>x.res==='bad')?'bad':r.some(x=>x.res==='warn')?'warn':'ok';
const TXT={ok:'سليم',warn:'يحتاج متابعة',bad:'عطل محتمل'};
const tag=s=>`<span class="tag ${s}">${TXT[s]}</span>`;
function status(u){const v=visitsOf(u.id)[0];const due=v?addDays(v.date,u.every):today();return{last:v,due,late:due<today(),res:v?overall(evaluate(v,u)):null}}

const views={
admin(){
 const st=db.units.map(u=>({u,...status(u)}));
 const late=st.filter(s=>s.late).length, issue=st.filter(s=>s.res&&s.res!=='ok').length;
 const month=db.visits.filter(v=>v.date.slice(0,7)===today().slice(0,7)).length;
 return `<h1>لوحة الإدارة</h1>
 <div class="stats"><div class="stat"><span>المكيفات</span><b>${db.units.length}</b></div><div class="stat"><span>العملاء</span><b>${db.clients.length}</b></div>
 <div class="stat"><span>زيارات هذا الشهر</span><b>${month}</b></div><div class="stat"><span>صيانة متأخرة</span><b style="color:var(--bad)">${late}</b></div><div class="stat"><span>تحتاج متابعة</span><b style="color:var(--warn)">${issue}</b></div></div>
 <div class="card"><h2>المكيفات</h2><table><tr><th>الرقم</th><th>العميل</th><th class="hide-sm">الموقع</th><th>آخر حالة</th><th>الصيانة القادمة</th></tr>
 ${st.map(s=>`<tr><td><a href="#u=${s.u.id}">${s.u.id}</a></td><td>${esc(client(s.u.client).name)}</td><td class="hide-sm">${esc(s.u.place)}</td><td>${s.res?tag(s.res):'لا يوجد'}</td><td>${s.due}${s.late?' <span class="tag bad">متأخرة</span>':''}</td></tr>`).join('')}</table></div>
 <div class="card"><h2>آخر الزيارات</h2><table><tr><th>التقرير</th><th>المكيف</th><th>الفني</th><th>التاريخ</th><th>النتيجة</th></tr>
 ${[...db.visits].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(v=>`<tr><td><a href="#r=${v.id}">${v.id}</a></td><td>${v.unit}</td><td>${esc(v.tech)}</td><td>${v.date}</td><td>${tag(overall(evaluate(v,unit(v.unit))))}</td></tr>`).join('')}</table></div>`;
},
u(id){
 const u=unit(id); if(!u) return '<p>مكيف غير موجود</p>'; const c=client(u.client), s=status(u);
 return `<div class="card"><div class="unit-head"><img src="assets/qr-${u.id}.svg" alt="QR ${u.id}"><div style="flex:1;min-width:220px">
 <h1>ملف المكيف ${u.id}</h1><div>${esc(c.name)}، ${esc(c.city)}<br>${esc(u.place)}<br>${u.type} · ${u.brand} · ${L(u.btu.toLocaleString('en')+' BTU · '+u.gas)}<br>
 الصيانة القادمة: <b>${L(s.due)}</b> ${s.late?'<span class="tag bad">متأخرة</span>':''} (كل ${u.every} يومًا)</div>
 <p class="noprint"><a class="btn" href="#tech=${u.id}">تسجيل زيارة صيانة</a></p></div></div></div>
 <div class="card"><h2>سجل الصيانة</h2>${visitsOf(id).length?`<table><tr><th>التاريخ</th><th>الفني</th><th>العمل</th><th>النتيجة</th><th></th></tr>
 ${visitsOf(id).map(v=>`<tr><td>${v.date}</td><td>${esc(v.tech)}</td><td>${esc(v.work)}</td><td>${tag(overall(evaluate(v,u)))}</td><td><a href="#r=${v.id}">التقرير</a></td></tr>`).join('')}</table>`:'<p>لا توجد زيارات بعد.</p>'}</div>`;
},
tech(id){
 if(!id) return `<h1>شاشة الفني</h1><div class="card"><p>في الواقع يمسح الفني رمز QR الملصق على المكيف بكاميرا الجوال فيفتح هذا النموذج مباشرة. هنا اختر مكيفًا:</p>
 ${db.units.map(u=>`<p><a class="btn alt" href="#tech=${u.id}">${u.id} · ${esc(client(u.client).name)} · ${esc(u.place)}</a></p>`).join('')}</div>`;
 const u=unit(id); if(!u) return '<p>مكيف غير موجود</p>';
 return `<h1>زيارة صيانة: ${u.id}</h1><div class="card"><div style="margin-bottom:.8rem">${esc(client(u.client).name)} · ${esc(u.place)} · ${u.type} ${L(u.btu.toLocaleString('en')+' BTU')}</div>
 <form id="f"><div class="grid2">
 <div><label>الفني</label><select name="tech">${db.techs.map(t=>`<option>${t}</option>`).join('')}</select></div>
 <div><label>نوع العمل</label><select name="work"><option>فحص دوري</option><option>تنظيف فلاتر وفحص تصريف</option><option>غسيل كامل للوحدة</option><option>تعبئة غاز</option><option>إصلاح عطل</option></select></div>
 <div><label>ضغط السحب (psi) <span class="hint">المرجع ${L(LIMITS.suction.join('–'))}</span></label><input name="suction" type="number" step="1" required inputmode="numeric"></div>
 <div><label>تيار الضاغط (A) <span class="hint">المقنن ${u.ratedA}</span></label><input name="amps" type="number" step="0.1" required inputmode="decimal"></div>
 <div><label>حرارة الهواء الراجع (<bdi dir="ltr">°C</bdi>)</label><input name="returnT" type="number" step="0.1" required inputmode="decimal"></div>
 <div><label>حرارة الهواء الخارج (<bdi dir="ltr">°C</bdi>)</label><input name="supplyT" type="number" step="0.1" required inputmode="decimal"></div>
 <div><label>حالة الفلتر</label><select name="filter"><option>نظيف</option><option>متسخ وتم تنظيفه</option><option>يحتاج تبديل</option></select></div>
 <div><label>صور قبل وبعد <span class="hint">تفتح الكاميرا في الجوال</span></label><input name="photos" type="file" accept="image/*" capture="environment" multiple></div>
 </div><div class="photos" id="pv" style="margin-top:.6rem"></div>
 <label style="margin-top:.6rem">ملاحظات</label><textarea name="notes" rows="2"></textarea>
 <p><button class="btn">حفظ وإنشاء التقرير</button></p></form></div>`;
},
r(id){
 const v=db.visits.find(x=>x.id===id); if(!v) return '<p>تقرير غير موجود</p>'; const u=unit(v.unit), c=client(u.client), ev=evaluate(v,u);
 return `<p class="noprint"><button class="btn" onclick="print()">حفظ PDF / طباعة</button> <a class="btn alt" href="#u=${u.id}">ملف المكيف</a></p>
 <div class="report"><div class="top"><div><b style="font-size:1.2rem">تقرير صيانة مكيف</b><br>رقم التقرير ${L(v.id)}، بتاريخ ${L(v.date)}</div><div class="logo">شعار شركتك</div></div>
 <div class="meta"><div><span>العميل:</span> ${esc(c.name)}</div><div><span>المدينة:</span> ${esc(c.city)}</div><div><span>المكيف:</span> ${L(u.id)}</div>
 <div><span>الموقع:</span> ${esc(u.place)}</div><div><span>النوع:</span> ${u.type} ${u.brand}</div><div><span>القدرة:</span> ${L(u.btu.toLocaleString('en')+' BTU · '+u.gas)}</div>
 <div><span>الفني:</span> ${esc(v.tech)}</div><div><span>العمل:</span> ${esc(v.work)}</div><div><span>الصيانة القادمة:</span> ${L(addDays(v.date,u.every))}</div></div>
 <table><tr><th>القياس</th><th>القيمة</th><th>المرجع</th><th>النتيجة</th></tr>${ev.map(x=>`<tr><td>${x.label}</td><td>${x.unit?L(esc(x.value)+' '+x.unit):esc(x.value)}</td><td>${x.why}</td><td>${tag(x.res)}</td></tr>`).join('')}</table>
 <p><b>الحالة العامة:</b> ${tag(overall(ev))}${v.notes?`<br><b>ملاحظات الفني:</b> ${esc(v.notes)}`:''}</p>
 ${v.photos.length?`<div class="photos">${v.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}
 <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:1rem"><div class="sig" style="flex:1;gap:2rem"><div>توقيع الفني</div><div>توقيع العميل</div></div>
 <img src="assets/qr-${u.id}.svg" style="width:90px;margin-inline-start:1.5rem" alt=""></div>
 <p class="hint" style="margin-top:.6rem">امسح الرمز لعرض سجل صيانة هذا المكيف كاملًا.</p></div>`;
},
design(){
 const T=[['clients','العملاء','الاسم، الجوال، المدينة'],['sites','المواقع','العميل، العنوان، الإحداثيات'],['units','المكيفات','الموقع، النوع، الماركة، BTU، الغاز، التيار المقنن، دورة الصيانة، رمز QR'],
  ['technicians','الفنيون','الاسم، الجوال، الصلاحية'],['visits','الزيارات','المكيف، الفني، الموعد، الحالة (مجدولة/منفذة)، نوع العمل'],['readings','القياسات','الزيارة، الضغط، الحرارة، التيار، الفلتر'],
  ['photos','الصور','الزيارة، قبل/بعد، رابط التخزين'],['reports','التقارير','الزيارة، ملف PDF، تاريخ الإرسال للعميل']];
 return `<h1>عيّنة من مخرجات مرحلة التحليل</h1>
 <div class="card"><h2>سير العمل</h2><div class="flow"><div>الإدارة تضيف العميل والموقع والمكيفات، فيُطبع لكل مكيف ملصق QR</div><div>النظام يجدول الزيارة القادمة من دورة الصيانة ويسندها لفني</div>
 <div>الفني يمسح QR فيفتح ملف المكيف ونموذج الزيارة</div><div>يُدخل القياسات ويرفع الصور قبل وبعد</div><div>النظام يقارن القياسات بالحدود وينشئ تقرير PDF</div><div>يُحدَّث سجل المكيف ويصل التقرير للعميل في صفحته</div></div></div>
 <div class="card"><h2>قاعدة البيانات (الجداول الأساسية)</h2><table><tr><th>الجدول</th><th>المحتوى</th><th>أهم الحقول</th></tr>${T.map(t=>`<tr><td><code>${t[0]}</code></td><td>${t[1]}</td><td>${t[2]}</td></tr>`).join('')}</table>
 <p class="hint">كل مكيف له معرّف ثابت داخل رمز QR، فتبديل الفني أو العميل لا يغيّر الملصق.</p></div>
 <div class="card"><h2>الشاشات في النسخة الأولى</h2><p>لوحة الإدارة · ملف المكيف · شاشة الفني (جوال) · التقرير · صفحة العميل. الصفحات الثلاث الأولى في هذا النموذج تعمل الآن كما ستعمل في النظام.</p></div>`;
}};

function render(){
 const h=decodeURIComponent(location.hash.slice(1))||'admin', [k,arg]=h.split('=');
 const v=views[k]?k:'admin';
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v||(v==='u'||v==='r')&&a.dataset.v==='admin'));
 $('#app').innerHTML=views[v](arg); scrollTo(0,0);
 const f=$('#f'); if(!f) return;
 let shots=[];
 f.photos.onchange=async()=>{shots=await Promise.all([...f.photos.files].slice(0,4).map(shrink));$('#pv').innerHTML=shots.map(p=>`<img src="${p}">`).join('')};
 f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));
  const v={id:'V-'+(1001+db.visits.length),unit:arg,tech:d.tech,date:today(),suction:+d.suction,supplyT:+d.supplyT,returnT:+d.returnT,amps:+d.amps,filter:d.filter,work:d.work,notes:d.notes,photos:shots};
  db.visits.push(v);try{save()}catch{v.photos=[];save()} location.hash='r='+v.id};
}
function shrink(file){return new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,480/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(file)})}
$('#reset').onclick=e=>{e.preventDefault();db=structuredClone(SEED);save();location.hash='admin';render()};
addEventListener('hashchange',render);render();

if(/[?&]selftest\b/.test(location.search)){ // assertions on the evaluation rules
 const u=SEED.units[0],a=(c,m)=>{if(!c)throw Error(m)};
 a(overall(evaluate({suction:128,supplyT:13,returnT:24,amps:8.9,filter:'نظيف'},u))==='ok','normal visit should be ok');
 a(overall(evaluate({suction:100,supplyT:13,returnT:24,amps:8.9,filter:'نظيف'},u))==='warn','low suction should warn');
 a(overall(evaluate({suction:128,supplyT:18,returnT:24,amps:8.9,filter:'نظيف'},u))==='warn','low dT should warn');
 a(overall(evaluate({suction:128,supplyT:13,returnT:24,amps:11,filter:'نظيف'},u))==='bad','amps 116% of rated should be bad');
 a(addDays('2026-07-02',90)==='2026-09-30','next due date');
 document.title='selftest=pass';
}
</script>
